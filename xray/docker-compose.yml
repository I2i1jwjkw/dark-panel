services:
  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: dark-panel-xray
    restart: unless-stopped
    ports:
      - "443:443/tcp"
    volumes:
      - ./config.json:/etc/xray/config.json:ro
      - ./certs:/etc/xray/certs:ro
    command: ["run", "-config", "/etc/xray/config.json"]
